[project]
name = "nexto-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "fastapi-users>=15.0.5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.5",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.fastapi]
entrypoint = "tracker.main:app"
