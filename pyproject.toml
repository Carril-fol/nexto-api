[project]
name = "nexto-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.0",
    "psycopg2>=2.9.13",
    "asyncpg>=0.32.0",
    "git-filter-repo>=2.47.0",
    "fastapi-mail>=1.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.fastapi]
entrypoint = "tracker.main:app"
